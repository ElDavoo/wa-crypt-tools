name: "Lint, tests, coverage"

on:
    push:
        branches:
        - '*'
    pull_request:
        branches:
        - main
    workflow_call:


permissions:
  contents: read

jobs:
  job:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    # `.[test]` pins every tool this needs, lint included, so CI and a local venv run the same
    # versions. It used to also `pip install flake8 pytest codecov pytest-cov coveralls`
    # unpinned alongside it, which meant the lint gate was whatever PyPI served that morning --
    # and `codecov` was installed but never called.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]'
    # tests/gui/test_app.py builds a real Tk window, so it needs a display; without one it
    # skips, and the widget code would then be covered on the Windows leg alone.
    - name: Install xvfb
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb
    # The coverage floor lives in .coveragerc, so `python -m pytest --cov` enforces it locally
    # too rather than only in CI.
    - name: Test with pytest (under xvfb)
      if: runner.os == 'Linux'
      run: xvfb-run -a python -m pytest --cov
    - name: Test with pytest
      if: runner.os != 'Linux'
      run: |
        python -m pytest --cov
    - name: Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
      if: github.event_name != 'pull_request'
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Lint, formatting and types run once, not once per matrix leg: the answer does not depend on
  # the OS or the Python version, and ruff is fast enough that a dedicated job costs less than
  # ten repetitions of it.
  #
  # ruff replaces flake8 here. The old gate only ever blocked on `--select=E9,F63,F7,F82` --
  # syntax errors and undefined names -- with a second `--exit-zero` pass that could not fail
  # and so was never read. That left 17 unused imports, 2 unused locals and a redefinition in
  # the tree with CI green. The rule set is selected explicitly in pyproject.toml; see the
  # comment there for why it is not left to ruff's default.
  #
  # mypy is deliberately advisory. The codebase is partly annotated, so a blocking type gate
  # would mean either a large annotation pass first or a baseline file to carry the debt --
  # neither of which belongs in the same change as the lint switch. `continue-on-error` keeps
  # its output one click away in the run without letting it hold up a merge.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]'

    # --output-format=github turns each finding into an annotation on the diff.
    - name: Lint with ruff
      run: ruff check --output-format=github .

    - name: Check formatting with ruff
      run: ruff format --check --diff .

    - name: Type-check with mypy (advisory)
      continue-on-error: true
      run: mypy src/wa_crypt_tools

  # actionlint type-checks every ${{ }} expression against the event payload and runs shellcheck
  # over each `run:` block; zizmor audits the same files for the supply-chain and permissions
  # mistakes that shellcheck has no opinion about. Between them they are the only test these
  # workflows have -- a mistake in one is otherwise found when a release quietly does nothing.
  #
  # Both are downloaded and checksum-pinned rather than taken from an action: a workflow that
  # exists to insist every action is pinned to a hash should not fetch its own linters unpinned.
  #
  # zizmor runs --offline: the online audits agree with the offline ones on this repository, and
  # a gate that needs a token and the network is a gate that fails for reasons of its own.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Check the workflows
      env:
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        ZIZMOR_SHA256: dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
      run: |
        set -euo pipefail

        curl -fsSL -o /tmp/actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
        tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
        /tmp/actionlint -color

        curl -fsSL -o /tmp/zizmor.tar.gz \
          https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
        echo "${ZIZMOR_SHA256}  /tmp/zizmor.tar.gz" | sha256sum -c -
        tar -xzf /tmp/zizmor.tar.gz -C /tmp zizmor
        /tmp/zizmor --offline --color=always .github/workflows/

  # One stable check for the whole matrix to hang the branch ruleset off.
  #
  # Requiring the ten matrix contexts by name meant the ruleset silently drifted from the
  # matrix in both directions: drop a Python version and every PR waits forever on a context
  # nothing reports any more, indistinguishable from CI being slow; add one and it is not
  # required, so a PR whose only failure is the newest Python still merges. `needs` follows
  # the matrix on its own, so this name is the only thing the ruleset has to know.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when the matrix fails, and
  # GitHub reads a skipped required check as satisfied -- turning the gate into a no-op exactly
  # when it is supposed to bite.
  all-green:
    if: always()
    needs: [job, lint, workflows]
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix result
        run: |
          echo "matrix result:    ${{ needs.job.result }}"
          echo "lint result:      ${{ needs.lint.result }}"
          echo "workflows result: ${{ needs.workflows.result }}"
          [ "${{ needs.job.result }}" = success ] \
            && [ "${{ needs.lint.result }}" = success ] \
            && [ "${{ needs.workflows.result }}" = success ]
