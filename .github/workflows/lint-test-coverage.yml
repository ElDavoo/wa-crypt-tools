name: "Lint, tests, coverage"

on:
    push:
        branches:
        - '*'
    pull_request:
        branches:
        - main
    workflow_call:


permissions:
  contents: read

jobs:
  job:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest codecov pytest-cov coveralls
        python -m pip install -e .[test]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest --cov
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      if: github.event_name != 'pull_request'
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # One stable check for the whole matrix to hang the branch ruleset off.
  #
  # Requiring the ten matrix contexts by name meant the ruleset silently drifted from the
  # matrix in both directions: drop a Python version and every PR waits forever on a context
  # nothing reports any more, indistinguishable from CI being slow; add one and it is not
  # required, so a PR whose only failure is the newest Python still merges. `needs` follows
  # the matrix on its own, so this name is the only thing the ruleset has to know.
  #
  # `if: always()` is load-bearing. Without it this job is skipped when the matrix fails, and
  # GitHub reads a skipped required check as satisfied -- turning the gate into a no-op exactly
  # when it is supposed to bite.
  all-green:
    if: always()
    needs: [job]
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix result
        run: |
          echo "matrix result: ${{ needs.job.result }}"
          [ "${{ needs.job.result }}" = success ]
