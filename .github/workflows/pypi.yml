name: Upload Python Package to PyPI when a Release is Created

on:
  push:
    tags:
      - 'v*'

# A called workflow is capped by what the caller grants, so each call is given exactly what
# that workflow declares for itself and nothing else.
permissions: {}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/lint-test-coverage.yml
  release:
    # Creating the release is all this job does, so contents: write is all it gets.
    permissions:
      contents: write
    needs:
      - codeql
      - tests
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      # actions/create-release was archived in 2021 and is unmaintained. `gh` is preinstalled
      # on the runner and does the same job, so the replacement drops a dependency rather than
      # swapping it for another one. Note the title is now "Release v1.2.3" rather than
      # "Release refs/tags/v1.2.3": github.ref_name is the tag, github.ref was the full ref.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Release $TAG" --notes ""
  pypi-publish:
    needs: release
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wa-crypt-tools
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt
      - name: Build package
        run: |
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1