name: Agent · stop

# The kill switch. Labelling an issue or a pull request `agent:stop` halts the pipeline for it.
#
# Two halves are needed and neither is enough alone: every other agent workflow refuses to start
# while the label is present, and this one cancels what is already running. The label alone
# cannot stop a fix round that is thirty minutes into a Gradle build.
#
# The opt-out label (`no-agent`) is not this. It only works applied at creation — a label added
# after the fact loses the race with the `issues: opened` trigger — which is why the issue
# template carries it and why this file exists as the escape hatch that always works.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  stop:
    if: github.event.label.name == 'agent:stop'
    runs-on: ubuntu-latest

    steps:
      - name: Work out which branch is affected
        id: ctx
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -n "${HEAD_REF:-}" ]; then
            branch="$HEAD_REF"
          else
            branch="agent/issue-${ISSUE_NUMBER}"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "branch: $branch"

      - name: Cancel what is already running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          set -euo pipefail
          # Best effort, and branch-scoped: a plan stage that has not opened a branch yet runs
          # against main and cannot be told apart from any other run here. That window is
          # seconds to a couple of minutes, and the label still stops every stage after it.
          ids=$(gh run list --branch "$BRANCH" --limit 50 \
                  --json databaseId,status \
                  --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId')
          if [ -z "$ids" ]; then
            echo "nothing running on $BRANCH"
            exit 0
          fi
          for id in $ids; do
            echo "cancelling run $id"
            gh run cancel "$id" || true
          done

      # Drafting disarms auto-merge. That is the point of doing it here rather than only
      # labelling: the label stops the pipeline, and the draft stops the merge that a
      # already-green run could otherwise still complete.
      - name: Draft the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "no open pull request for $BRANCH"
            exit 0
          fi
          gh pr ready --undo "$pr" || true
          tick='`'
          printf 'Stopped by the %sagent:stop%s label. Auto-merge is disarmed and this is now a draft. Remove the label and re-run %sAgent · implement%s from the Actions tab to pick it back up.\n' \
            "$tick" "$tick" "$tick" "$tick" > /tmp/stopped.md
          gh pr comment "$pr" --body-file /tmp/stopped.md
