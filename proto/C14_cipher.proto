edition = "2023";

// crypt14 cipher files.
message C14_cipher {
    bytes backup_cipher_header = 1; // is usually 0001
    bytes key_version = 2; // Is usually "1"
    bytes server_salt = 3; // The 32-bytes long server salt
    bytes google_id_salt = 4; // The 16-bytes long google id salt
    bytes encryption_iv = 5; // The 16-bytes long IV
}
