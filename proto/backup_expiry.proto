edition = "2023";
// This describes the metadata, e.g. the version, the ph number and various features.
//
// The names are WhatsApp's own. What this project called the "feature table" is a set of
// database migration flags: every one of fields 5 to 37 is named <migration>_migration_finished
// in the app, and says that that migration had already run when the backup was written.
message BackupExpiry {
    string app_version = 1; // Whatsapp version, for example "2.22.4.14"
    string device_model = 2;
    string jid_suffix = 3; // The last two numbers of the user's Jid (phone number)
    // The migration flags below are only written if the backup is a msgstore backup.
    int32 backup_version = 4;
    bool call_log_migration_finished = 5;
    bool labeled_jid_migration_finished = 6;
    bool message_fts_migration_finished = 7;
    bool blank_me_jid_migration_finished = 8;
    bool message_link_migration_finished = 9;
    bool message_main_migration_finished = 10;
    bool message_text_migration_finished = 11;
    bool missed_calls_migration_finished = 12;
    bool receipt_user_migration_finished = 13;
    bool message_media_migration_finished = 14;
    bool message_vcard_migration_finished = 15;
    bool message_future_migration_finished = 16;
    bool message_quoted_migration_finished = 17;
    bool message_system_migration_finished = 18;
    bool receipt_device_migration_finished = 19;
    bool message_mention_migration_finished = 20;
    bool message_revoked_migration_finished = 21;
    bool broadcast_me_jid_migration_finished = 22;
    bool message_frequent_migration_finished = 23;
    bool message_location_migration_finished = 24;
    bool participant_user_migration_finished = 25;
    bool message_thumbnail_migration_finished = 26;
    bool message_send_count_migration_finished = 27;
    bool migration_jid_store_migration_finished = 28;
    bool payment_transaction_migration_finished = 29;
    bool migration_chat_store_migration_finished = 30;
    bool quoted_order_message_migration_finished = 31;
    bool media_migration_fixer_migration_finished = 32;
    bool quoted_order_message_v2_migration_finished = 33;
    bool message_main_verification_migration_finished = 34;
    bool quoted_ui_elements_reply_message_migration_finished = 35;
    bool alter_message_ephemeral_to_message_ephemeral_remove_column_migration_finished = 36;
    bool alter_message_ephemeral_setting_to_message_ephemeral_setting_remove_column_migration_finished = 37;
    int64 backup_export_file_size = 38; // The size of the backup file
    bool cleaned_db = 39; // does not show in incremental backups
    // Set on the backups that are not a msgstore -- wa.db carries both.
    bytes backup_encrypted_hash_salt = 40;
    bytes backup_encrypted_hash = 41;
    // An enum in the app, kept as an int here: it is a varint on the wire either way, and its
    // values were not recovered.
    int32 identifier_type = 42;
    string lid_suffix = 43;
    string display_suffix = 44;
}
