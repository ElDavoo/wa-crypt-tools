[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-crypt-tools"
keywords = ["whatsapp", "crypt12", "crypt14", "crypt15"]
version = "0.2.0"
authors = [
    {name = "Davide Palma", email = "pypi@davidepalma.it"},
]
description = "Manages WhatsApp .crypt12, .crypt14 and .crypt15 files, given the key."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "javaobj-py3 >= 0.4.4",
    "pycryptodomex >= 3.20.0",
    "protobuf >= 7.36.0,< 8.0.0"
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
wacreatekey = "wa_crypt_tools.wacreatekey:main"
wadecrypt = "wa_crypt_tools.wadecrypt:main"
waencrypt = "wa_crypt_tools.waencrypt:main"
waguess = "wa_crypt_tools.waguess:main"
wainfo = "wa_crypt_tools.wainfo:main"

# gui-scripts, not scripts: this is what makes Windows build a console-less wagui.exe, so a
# double-click opens the window and nothing else.
[project.gui-scripts]
wagui = "wa_crypt_tools.gui:main"

[project.optional-dependencies]
# Reading a key off a screenshot (KeyFactory.new on an image). Needs the tesseract binary too:
# Debian/Ubuntu "apt install tesseract-ocr", macOS "brew install tesseract",
# Windows "winget install UB-Mannheim.TesseractOCR".
ocr = [
    "pytesseract >= 0.3.13",
    # pytesseract depends on Pillow already, but lib/key/ocr.py imports PIL itself.
    "Pillow >= 10.0.0"
]
test = [
    "pytest >= 8.0.0",
    "pytest-cov >= 4.0.0",
    # Subprocess coverage for tests/tools-invocation/ relies on the .pth file coverage
    # installs into site-packages; see conftest.py. Pinned to a version known to ship it.
    "coverage >= 7.16.0",
    # Rule selection lives in [tool.ruff.lint] below. The upper bound is deliberate: ruff adds
    # rules to existing groups in minor releases, so an unbounded range lets a routine dependabot
    # bump turn CI red on code nobody touched.
    "ruff >= 0.16.5, < 0.17",
    # Advisory only -- CI reports mypy but does not fail on it. See the workflow for why.
    "mypy >= 1.18.0",
    "coveralls >= 3.3.0"
]

[tool.ruff]
line-length = 127
# Generated protobuf classes. protoc writes them, `proto/fix_imports.py` rewrites five import
# lines in one of them, and nothing here is hand-maintained -- linting them only produces
# findings no one may act on. `proto/fix_imports.py` itself lives at the repo root and IS linted.
extend-exclude = ["src/wa_crypt_tools/proto"]

[tool.ruff.lint]
# Selected explicitly rather than left to ruff's default set. Dependabot bumps ruff daily here,
# and the default set grows between minor releases -- an implicit set means a dependency bump can
# turn CI red on code nobody touched. The version range in the `test` extra is the other half of
# that: patch releases fix bugs, minor releases add rules.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes -- unused imports and names, the gap the old flake8 select left open
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "SIM",         # flake8-simplify
    "C4",          # flake8-comprehensions
    "PIE",         # flake8-pie
    "RET",         # flake8-return
    "BLE",         # flake8-blind-except
    "RUF",         # ruff's own
    "PLE", "PLW",  # pylint errors and warnings
    "PLR1722",     # exit() -- which only exists when `site` ran -- instead of sys.exit()
    "PLR1730",     # if-stmt-min-max
    "TRY201",      # `raise e` inside `except ... as e` instead of a bare `raise`
]

[tool.ruff.lint.per-file-ignores]
# The NullHandler has to be attached before the submodules are imported, or importing this
# library as a library warns on any log record it emits. That puts the re-exports below it.
"src/wa_crypt_tools/__init__.py" = ["E402"]
# Tests open fixtures and hand the handle to a factory that reads the header off it, then read
# the rest themselves -- a `with` block around that would close the file mid-assertion.
"tests/*" = ["SIM115"]

[tool.mypy]
python_version = "3.10"
# Third-party packages that ship no type information: javaobj and pycryptodomex. Without this
# every import of them is an error, which buries the findings that are about this code.
ignore_missing_imports = true
# Generated protobuf classes, and the stubs protoc does not write for them.
exclude = "^src/wa_crypt_tools/proto/"

[[tool.mypy.overrides]]
module = "wa_crypt_tools.proto.*"
ignore_errors = true
